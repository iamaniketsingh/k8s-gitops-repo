apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iamaniketsingh/k8s-gitops-repo.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: deafult
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
